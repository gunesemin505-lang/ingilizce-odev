<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Flags</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d1d1f;--muted:#666;--accent:#e30a17;--line:#e2ded4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#202228;--text:#f1f1f1;--muted:#a0a3ab;--accent:#ff4d5a;--line:#33363f}}
:root[data-theme="dark"]{--bg:#15161a;--card:#202228;--text:#f1f1f1;--muted:#a0a3ab;--accent:#ff4d5a;--line:#33363f}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Kalam","Comic Sans MS",cursive,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 14px 40px}
h1{text-align:center;margin:8px 0 4px;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700}
.sub{text-align:center;color:var(--muted);margin:0 0 22px}
#list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#list button{font:inherit;font-size:1rem;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);cursor:pointer}
#list button:hover{border-color:var(--accent);color:var(--accent)}
#list button.tr{border-color:var(--accent);font-weight:700}
#detail{display:none;text-align:center}
.flag{font-family:"Noto Color Emoji",sans-serif;font-size:clamp(9rem,42vw,20rem);line-height:1.1;margin:10px 0}
#detail h2{font-size:clamp(1.6rem,5vw,2.6rem);margin:6px 0;font-weight:700}
#detail p{font-size:clamp(1.1rem,3.5vw,1.6rem);color:var(--muted);margin:0 0 26px}
#back{font:inherit;font-size:1.05rem;padding:12px 28px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
body.open #list,body.open .intro{display:none}
body.open #detail{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="intro"><h1>🌍 World Flags</h1><p class="sub">Click a country to see its flag and nationality.</p></div>
  <div id="list"></div>
  <div id="detail"><div class="flag" id="f"></div><h2 id="n"></h2><p id="d"></p><button id="back">← Back</button></div>
</div>
<script>
const D="TR,Türkiye,Turkish|FR,France,French|DE,Germany,German|IT,Italy,Italian|ES,Spain,Spanish|PT,Portugal,Portuguese|GB,United Kingdom,British|IE,Ireland,Irish|NL,Netherlands,Dutch|BE,Belgium,Belgian|CH,Switzerland,Swiss|AT,Austria,Austrian|SE,Sweden,Swedish|NO,Norway,Norwegian|DK,Denmark,Danish|FI,Finland,Finnish|GR,Greece,Greek|PL,Poland,Polish|CZ,Czechia,Czech|HU,Hungary,Hungarian|RO,Romania,Romanian|BG,Bulgaria,Bulgarian|UA,Ukraine,Ukrainian|RU,Russia,Russian|US,United States,American|CA,Canada,Canadian|MX,Mexico,Mexican|BR,Brazil,Brazilian|AR,Argentina,Argentine|CL,Chile,Chilean|CO,Colombia,Colombian|PE,Peru,Peruvian|CU,Cuba,Cuban|JP,Japan,Japanese|CN,China,Chinese|KR,South Korea,South Korean|IN,India,Indian|PK,Pakistan,Pakistani|ID,Indonesia,Indonesian|TH,Thailand,Thai|VN,Vietnam,Vietnamese|SA,Saudi Arabia,Saudi|IR,Iran,Iranian|IQ,Iraq,Iraqi|EG,Egypt,Egyptian|ZA,South Africa,South African|NG,Nigeria,Nigerian|MA,Morocco,Moroccan|AU,Australia,Australian|AZ,Azerbaijan,Azerbaijani".split("|").map(s=>s.split(","));
const emoji=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0)));
const list=document.getElementById("list");
D.forEach(([c,n])=>{const b=document.createElement("button");b.textContent=n;if(c==="TR")b.className="tr";b.onclick=()=>show(c);list.appendChild(b)});
function show(c){
  const x=D.find(a=>a[0]===c);if(!x)return;
  document.getElementById("f").textContent=emoji(c);
  document.getElementById("n").textContent=x[1];
  document.getElementById("d").textContent=x[2];
  document.body.classList.add("open");window.scrollTo(0,0);
}
function home(){document.body.classList.remove("open");window.scrollTo(0,0)}
document.getElementById("back").onclick=home;
</script>
</body>
</html>
